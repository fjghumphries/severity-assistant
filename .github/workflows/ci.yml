name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Types, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p ui/tsconfig.json
      - run: npm run lint
      - run: npx jest

  # Builds exactly what a release would be: debug tooling removed, then proven absent from the bundle.
  # Fails if anything other than the debug folder had come to depend on it.
  release-guard:
    name: Release build without debug code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/release.mjs
